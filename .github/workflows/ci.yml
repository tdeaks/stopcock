name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: workspace checks (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
      - name: Verify Node runtime
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          node -e "const actual = process.versions.node.split('.')[0]; if (actual !== process.env.EXPECTED_NODE) throw new Error(\`expected Node \${process.env.EXPECTED_NODE}, got \${process.versions.node}\`)"
      - run: vp run build:packages
      - run: vp run lint:ci
        env:
          GOMAXPROCS: 2
      - run: vp run test:ci
