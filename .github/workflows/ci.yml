name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
      - run: vp run build:packages
      - run: vp run lint:ci
        env:
          GOMAXPROCS: 2
      - run: vp run test:packages
