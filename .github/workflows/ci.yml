name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: workspace checks (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
      - name: Verify Node runtime
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          node -e "const actual = process.versions.node.split('.')[0]; if (actual !== process.env.EXPECTED_NODE) throw new Error(\`expected Node \${process.env.EXPECTED_NODE}, got \${process.versions.node}\`)"
      - run: vp run build:packages
      - run: bun run test:types
      - run: vp run lint:ci
        env:
          GOMAXPROCS: 2
      - run: vp run test:packages

  fp-contract:
    name: fp 2.0 contract (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
      - name: Verify minimum Node runtime
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '22') throw new Error(\`expected Node 22, got \${process.versions.node}\`)"
      - run: bun run codegen:check
        working-directory: packages/fp
      - run: bun run manifest:check
        working-directory: packages/fp
      - run: bun run check:portable
        working-directory: packages/fp
      - run: bun run check:codegen-types
        working-directory: packages/fp
      - run: bun run check:script-types
        working-directory: packages/fp
      - run: bunx tsc -p tsconfig.json --noEmit
        working-directory: packages/fp
      - run: bun run check:types
        working-directory: packages/fp
      - run: node ../../tooling/build-package.mjs
        working-directory: packages/fp
      - run: bunx vitest run packages/fp/src/__tests__
      - run: bun run scripts/check-package-contract.ts
        working-directory: packages/fp

  fp-performance:
    name: fp performance (Bun/JSC + Node/V8, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
      - name: Verify minimum Node runtime
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '22') throw new Error(\`expected Node 22, got \${process.versions.node}\`)"
      - name: Report benchmark engines
        run: |
          bun --version
          node --version
          uname -sm
      - name: Build @stopcock/fp distribution for size gate
        run: node ../../tooling/build-package.mjs
        working-directory: packages/fp
      - name: Performance gates (Bun/JSC)
        run: bun run perf:gates
        working-directory: benchmarks
        env:
          PERF_ARTIFACT_DIR: ${{ runner.temp }}/stopcock-fp-performance
      - name: Performance gates (Node/V8)
        run: bun run src/reference/run-gates.ts --node
        working-directory: benchmarks
        env:
          PERF_ARTIFACT_DIR: ${{ runner.temp }}/stopcock-fp-performance
      - name: Upload FP performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-performance-${{ matrix.platform }}
          path: ${{ runner.temp }}/stopcock-fp-performance
          if-no-files-found: warn
