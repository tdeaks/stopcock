name: Publish packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.changeset/**'
      - '.github/workflows/publish.yml'
      - 'benchmarks/**'
      - 'bun.lock'
      - 'package.json'
      - 'tooling/**'
      - 'vite.config.ts'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify minimum Node runtime
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '22') throw new Error(\`expected Node 22, got \${process.versions.node}\`)"
      - run: vp run build:packages
      - run: bun run test:types
      - run: vp run test:packages
      - run: bun run codegen:check
        working-directory: packages/fp
      - run: bun run manifest:check
        working-directory: packages/fp
      - run: bun run check:portable
        working-directory: packages/fp
      - run: bun run check:codegen-types
        working-directory: packages/fp
      - run: bun run check:script-types
        working-directory: packages/fp
      - run: bunx tsc -p tsconfig.json --noEmit
        working-directory: packages/fp
      - run: bun run check:types
        working-directory: packages/fp
      - run: bun run scripts/check-package-contract.ts
        working-directory: packages/fp

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
      - name: Verify publish Node runtime
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error(\`expected Node 24, got \${process.versions.node}\`)"
      - run: vp run build:packages
      - run: npm install -g npm@latest
      - run: npm --version
      - uses: changesets/action@v1
        with:
          publish: vp exec changeset publish
          version: vp run changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
